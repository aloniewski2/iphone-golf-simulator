name: iOS CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          xcodebuild test \
            -project GolfArcade.xcodeproj \
            -scheme GolfArcade \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO

