name: iOS CI

on:
  pull_request:
    branches: [main, testing]
  push:
    branches: [main, testing]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-source-policy:
    name: main-source-policy
    runs-on: ubuntu-latest
    steps:
      - name: Require testing as the source for main
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" != "testing" ]]; then
            echo "Pull requests to main must come from the testing branch."
            exit 1
          fi

  # The merge gate: compile everything and run the unit suite. A few minutes.
  build-and-test:
    name: build-and-test
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$xcode" ]]; then
            echo "No Xcode 26 on this runner; CameraPoseTracker needs the iOS 26 SDK." >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Create iOS simulator
        id: simulator
        uses: ./.github/actions/simulator
      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project GolfArcade.xcodeproj \
            -scheme GolfArcade \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
      - name: Unit tests
        run: |
          xcodebuild test-without-building \
            -project GolfArcade.xcodeproj \
            -scheme GolfArcade \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath DerivedData \
            -only-testing:GolfArcadeTests
      - name: Keep the built products for the UI workers
        uses: actions/upload-artifact@v4
        with:
          name: test-products
          path: |
            DerivedData/Build/Products/*.xctestrun
            DerivedData/Build/Products/Debug-iphonesimulator
          retention-days: 1

  # The UI flows, on their own workers so they never hold a merge. Two classes, two runners.
  ui-tests:
    name: ui-tests (${{ matrix.suite }})
    needs: build-and-test
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [CameraPlayTests, CoursePlayTests]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Create iOS simulator
        id: simulator
        uses: ./.github/actions/simulator
      - uses: actions/download-artifact@v4
        with:
          name: test-products
          path: DerivedData/Build/Products
      - name: UI tests
        run: |
          xcodebuild test-without-building \
            -xctestrun "$(ls DerivedData/Build/Products/*.xctestrun | head -1)" \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -only-testing:GolfArcadeUITests/${{ matrix.suite }}
