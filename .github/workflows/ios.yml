name: iOS CI

on:
  pull_request:
    branches: [main, testing]
  push:
    branches: [main, testing]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-source-policy:
    name: main-source-policy
    runs-on: ubuntu-latest
    steps:
      - name: Require testing as the source for main
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" != "testing" ]]; then
            echo "Pull requests to main must come from the testing branch."
            exit 1
          fi

  build-and-test:
    name: build-and-test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$xcode" ]]; then
            echo "No Xcode 26 on this runner; CameraPoseTracker needs the iOS 26 SDK." >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Create iOS simulator
        id: simulator
        run: |
          runtime_id=$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.isAvailable and (.name | startswith("iOS")))] | sort_by(.version) | last.identifier // empty')
          if [[ -z "$runtime_id" ]]; then
            xcodebuild -downloadPlatform iOS
            runtime_id=$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.isAvailable and (.name | startswith("iOS")))] | sort_by(.version) | last.identifier // empty')
          fi
          device_type_id=$(xcrun simctl list devicetypes --json | jq -r '[.devicetypes[] | select(.name == "iPhone 16 Pro")][0].identifier // [.devicetypes[] | select(.name | startswith("iPhone"))][-1].identifier')
          simulator_id=$(xcrun simctl create "GolfArcade CI" "$device_type_id" "$runtime_id")
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild test \
            -project GolfArcade.xcodeproj \
            -scheme GolfArcade \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            CODE_SIGNING_ALLOWED=NO
