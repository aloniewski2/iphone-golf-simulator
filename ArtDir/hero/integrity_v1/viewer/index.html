<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Motion Club · Character review</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #263c38; background: #f7f6f0; }
    body { margin: 0; }
    button, select, input { font: inherit; }
    button, select { color: inherit; }
    header { padding: 22px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #dedfd5; }
    .brand { font-weight: 650; font-size: 20px; letter-spacing: -.6px; }
    .subtitle { font-size: 13px; color: #6e7871; margin-top: 4px; }
    .tag { border: 1px solid #c7d4c5; border-radius: 20px; padding: 7px 12px; font-size: 12px; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 274px; height: calc(100dvh - 91px); min-height: 580px; }
    #stage { position: relative; min-width: 0; background: radial-gradient(ellipse at 50% 45%, #fffef9, #efeee5); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #loading { position: absolute; top: 46%; width: 100%; text-align: center; pointer-events: none; color: #6d786e; }
    .views { position: absolute; top: 22px; left: 24px; display: flex; gap: 5px; background: #fffdf7e8; border: 1px solid #dddfd5; border-radius: 12px; padding: 5px; }
    button { background: transparent; border: 0; border-radius: 8px; padding: 9px 12px; cursor: pointer; font-size: 13px; }
    button:hover { background: #e9eee4; }
    button[aria-pressed="true"] { background: #28463a; color: white; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #ef985f; outline-offset: 3px; }
    .hint { position: absolute; bottom: 23px; left: 24px; font-size: 12px; color: #738077; line-height: 1.7; pointer-events: none; }
    aside { padding: 28px 24px; border-left: 1px solid #dedfd5; background: #fffdf8; overflow-y: auto; }
    h1 { font-size: 19px; font-weight: 600; letter-spacing: -.4px; margin: 0 0 5px; }
    .small { color: #778077; font-size: 12px; line-height: 1.6; }
    .field { margin-top: 25px; }
    .field > label { display: block; font-size: 13px; font-weight: 550; margin-bottom: 10px; }
    select { width: 100%; padding: 11px 10px; border: 1px solid #d9dfd3; border-radius: 8px; background: #fffefb; }
    input[type="range"] { width: 100%; accent-color: #3e6850; }
    .range-labels { display: flex; justify-content: space-between; font-size: 11px; color: #7a8277; }
    .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
    .swatch { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #d6d9cf; }
    .swatch[aria-pressed="true"] { outline: 2px solid #456350; outline-offset: 2px; }
    .download { background: #28463a; color: white; margin-top: 30px; width: 100%; padding: 13px; }
    .download:hover { background: #3b614b; }
    #status { margin-top: 15px; min-height: 22px; }
    @media (max-width: 720px) { header { padding: 17px 20px; } main { grid-template-columns: 1fr; height: auto; min-height: 0; } #stage { height: 68dvh; min-height: 440px; } aside { border-left: 0; border-top: 1px solid #dedfd5; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 20px; } .field { margin-top: 0; } aside > .heading, aside > .download, aside > #status { grid-column: 1 / -1; } .download { margin-top: 0; } .hint { left: 18px; bottom: 14px; } .views { left: 15px; top: 15px; } }
  </style>
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <header><div><div class="brand">motion club</div><div class="subtitle">Character review</div></div><div class="tag">Actual game model</div></header>
  <main>
    <section id="stage" aria-label="Interactive three-dimensional character. Drag to rotate, scroll to zoom.">
      <div id="loading" role="status">Loading character…</div>
      <div class="views" aria-label="Camera views"><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="back">Back</button><button id="detail" aria-pressed="false">Face</button></div>
      <div class="hint">Drag to rotate · Scroll or pinch to zoom<br>Right-drag to pan</div>
    </section>
    <aside>
      <div class="heading"><h1>Repaired hero</h1><div class="small">Locker geometry · idle pose<br>Preview lighting differs from the game.</div></div>
      <div class="field"><label for="body">Body</label><select id="body"><option value="Boy">Male</option><option value="Girl">Female</option></select></div>
      <div class="field"><label for="hair">Hair</label><select id="hair"><option value="Swept">Swept</option><option value="Ponytail">Ponytail</option><option value="Bob">Bob</option><option value="Long">Long</option><option value="Curly">Curly</option></select></div>
      <div class="field"><label for="hat">Headwear</label><select id="hat"><option value="Visor">Visor</option><option value="None">None</option><option value="Cap">Cap</option><option value="Sweatband">Sweatband</option></select></div>
      <div class="field"><label for="size">Body size <span id="size-value">50%</span></label><input id="size" type="range" min="0" max="100" value="50"><div class="range-labels"><span>Slim</span><span>Broad</span></div></div>
      <div class="field"><label id="hair-color-label">Hair color</label><div id="hair-colors" class="swatches" role="group" aria-labelledby="hair-color-label"></div></div>
      <div class="field"><label id="skin-color-label">Skin tone</label><div id="skin-colors" class="swatches" role="group" aria-labelledby="skin-color-label"></div></div>
      <button id="download" class="download">Download current model (.glb)</button>
      <div id="status" class="small" role="status"></div>
    </aside>
  </main>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
