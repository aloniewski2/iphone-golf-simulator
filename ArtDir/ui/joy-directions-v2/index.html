<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Island Sports Club — 3 UI Directions</title><style>
*{box-sizing:border-box}body{margin:0;background:#10192b;color:#fff;font-family:Arial,sans-serif}header{padding:44px max(24px,5vw) 28px;border-bottom:1px solid #ffffff26}.eyebrow{font-size:12px;font-weight:700;letter-spacing:3px;color:#ffbe71;text-transform:uppercase}h1{font-size:clamp(32px,4vw,64px);letter-spacing:-2px;line-height:1.05;margin:16px 0}p{color:#bdc9de;line-height:1.6;font-size:17px;max-width:850px}nav{display:flex;gap:10px;flex-wrap:wrap;padding:24px max(24px,5vw);position:sticky;top:0;background:#10192bee;z-index:10;backdrop-filter:blur(16px)}button,a{font:inherit}button{padding:14px 20px;color:white;background:#ffffff10;border:1px solid #ffffff30;border-radius:12px;cursor:pointer;font-weight:700}button[aria-pressed=true]{background:#ffbe71;color:#10192b;border-color:#ffbe71}button:focus-visible,a:focus-visible{outline:3px solid #ffbe71;outline-offset:4px}main{padding:0 max(24px,5vw) 60px}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px}h2{font-size:34px;margin:16px 0 22px}.swatches{display:flex;gap:7px}.swatches span{width:30px;height:30px;border-radius:50%;border:1px solid #ffffff30}.art{width:100%;height:auto;display:block;border-radius:12px;background:#24344e}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:26px 0 40px}.details b{font-size:12px;letter-spacing:2px;color:#ffbe71}.details p{font-size:16px}a{color:#bfe9ff}footer{padding:20px 0;border-top:1px solid #ffffff26;font-size:14px;color:#bdc9de}.all .direction{display:block!important;margin-bottom:80px}@media(max-width:720px){.details{grid-template-columns:1fr;gap:10px}.heading{display:block}.swatches{margin-bottom:20px}nav{position:static}}
</style><body><header><div class="eyebrow">Island Sports Club / visual exploration 02</div><h1>More depth.<br>More personality. More joy.</h1><p>Three distinct directions, each showing loading, venue arrival, gameplay and results. These are visual concepts; the game and locked character assets are unchanged.</p></header><nav aria-label="Choose design direction"></nav><main></main><script>
fetch('directions.json').then(r=>r.json()).then(data=>{let selected=0;const nav=document.querySelector('nav'),main=document.querySelector('main');data.directions.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d.id+' / '+d.name;b.onclick=()=>select(i);nav.append(b);const s=document.createElement('section');s.className='direction';s.innerHTML=`<div class="heading"><h2>${d.name}</h2><div class="swatches">${d.palette.map(c=>`<span style="background:${c}" title="${c}"></span>`).join('')}</div><a href="${d.image}" target="_blank" aria-label="Open ${d.name} at full size"><img class="art" src="${d.image}" alt="${d.name}: loading, flyover, tennis HUD, and match result concept screens"></a><div class="details"><div><b>TYPOGRAPHY</b><p>${d.type}</p></div><div><b>DEPTH & MATERIALS</b><p>${d.depth}</p></div><div><b>JOY & MOTION</b><p>${d.joy}</p><p>${d.motion}</p></div></div>`;main.append(s);});const all=document.createElement('button');all.textContent='Compare all three';all.onclick=()=>select(-1);nav.append(all);const foot=document.createElement('footer');foot.innerHTML='AI-generated art-direction boards. Character poses and lettering are exploratory. Production UI keeps live text, real game state, existing V4 hero, and phone buttons for post-game actions. <a href="REVIEW.md">Read direction notes ↗</a>';main.append(foot);function select(n){selected=n;main.className=n<0?'all':'';main.querySelectorAll('.direction').forEach((s,i)=>s.style.display=n===i?'block':'none');nav.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',n<0?i===3:i===n));}select(0);});
</script></body></html>
