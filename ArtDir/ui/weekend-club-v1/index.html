<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Island Sports Club — UI Review v1</title><link rel="stylesheet" href="style.css"><body><header class="review"><div><div class="eyebrow">WEEKEND SPORTS CLUB / DESIGN DIRECTION 01</div><h1>Loading → last point → play again.</h1></div><a href="DESIGN_SYSTEM.md">Design notes ↗</a></header><nav aria-label="Screen examples"></nav><main><div class="stage"></div><div class="caption"></div></main><script>const screens=[{"id": "01-loading", "title": "Loading", "html": "<div class=\"frame\"><div class=\"safe\"><div class=\"topline\"><span class=\"club\">ISLAND / SPORTS CLUB</span><span class=\"chip\">TENNIS</span></div><div class=\"courtmark\"></div><div style=\"position:absolute;top:166px;width:650px\"><div class=\"eyebrow\">NEXT UP / TROPICAL OPEN</div><h1>Court\u2019s almost<br>yours.</h1><p class=\"muted\" style=\"margin-top:24px\">One court. A little friendly competition.</p></div><div style=\"position:absolute;right:70px;top:170px\"><div class=\"artmark\"><div class=\"ball\"></div></div></div><div class=\"bottom\"><div class=\"footerline\"><span>Warming up the court\u2026</span><strong>72%</strong></div><div class=\"progress\" style=\"margin:14px 0 22px\"><i style=\"width:72%\"></i></div><div class=\"row\"><span class=\"chip dark\">QUICK TIP</span><p class=\"small\">Clean timing sends the ball faster.</p></div></div></div></div>", "note": "Progress follows real readiness. Racket illustration stands in for a short in-engine idle; no generated character replacement."}, {"id": "02-flyover", "title": "Drone flyover", "html": "<div class=\"frame court\"><div class=\"safe\"><div class=\"topline\"><span class=\"chip dark\">TENNIS / SINGLES</span><span class=\"chip\">ROUND 05</span></div><div class=\"bottom row\" style=\"justify-content:space-between;align-items:end\"><div class=\"ticket\"><div class=\"eyebrow\">WELCOME TO</div><h1 style=\"font-size:66px\">Tropical Open</h1><p class=\"small\" style=\"margin-top:12px\">Sun out. Game on.</p></div><button class=\"button secondary\">Skip intro \u2192</button></div></div></div>", "note": "Lower-left venue ticket during the existing flyover. Current court capture is a composition backdrop, not a new camera specification."}, {"id": "03-matchup", "title": "Match intro", "html": "<div class=\"frame\"><div class=\"safe\"><div class=\"topline\"><span class=\"club\">ISLAND / SPORTS CLUB</span><span class=\"chip\">ROUND 05</span></div><div style=\"position:absolute;top:166px;left:0;right:0;text-align:center\"><div class=\"eyebrow\">ONE COURT. TWO PERSONALITIES.</div><div class=\"row\" style=\"justify-content:center;margin-top:35px\"><div class=\"panel\" style=\"width:380px;border-top:12px solid var(--orange)\"><span class=\"caps\">YOU</span><h2 style=\"margin:20px 0\">Adnan</h2><p class=\"small\">Ready for a rally.</p></div><span class=\"bold\" style=\"font-size:42px\">VS</span><div class=\"panel\" style=\"width:380px;border-top:12px solid var(--blue)\"><span class=\"caps\">OPPONENT</span><h2 style=\"margin:20px 0\">Riley</h2><p class=\"small\">Meet you at the net.</p></div></div></div><div class=\"bottom footerline\"><span>TENNIS \u00b7 FIRST TO 6 GAMES</span><span>You serve first \u2192</span></div></div></div>", "note": "Use equipped avatar portraits in the two open cards in production. Rules text is supplied by the actual match format."}, {"id": "04-calibration", "title": "Timing / pre-game check", "html": "<div class=\"frame\"><div class=\"safe\"><div class=\"topline\"><span class=\"club\">ISLAND / SPORTS CLUB</span><span class=\"chip\">QUICK WARM-UP</span></div><div style=\"margin-top:65px;max-width:640px\"><div class=\"eyebrow\">LET\u2019S FIND YOUR RHYTHM</div><h1>Swing on<br>the bounce.</h1><p style=\"margin-top:25px\">Watch the ball. Take one easy swing<br>each time it lands.</p></div><div class=\"ball\" style=\"position:absolute;right:155px;top:190px;width:110px;height:110px\"></div><div style=\"position:absolute;right:95px;top:335px;width:240px;height:14px;border-radius:50%;background:#20304718\"></div><div class=\"bottom panel row\" style=\"justify-content:space-between\"><div class=\"row\"><span class=\"check\">\u2713</span><div><h3>4 of 6 recorded</h3><p class=\"small muted\">Two more easy swings.</p></div></div><div class=\"row\"><span style=\"width:20px;height:20px;border-radius:50%;background:#ff6b3d\"></span><span style=\"width:20px;height:20px;border-radius:50%;background:#ff6b3d\"></span><span style=\"width:20px;height:20px;border-radius:50%;background:#ff6b3d\"></span><span style=\"width:20px;height:20px;border-radius:50%;background:#ff6b3d\"></span><span style=\"width:20px;height:20px;border-radius:50%;background:#d9dfe6\"></span><span style=\"width:20px;height:20px;border-radius:50%;background:#d9dfe6\"></span></div></div></div></div>", "note": "Explicit captured-swing count and retry state. Example total is illustrative; bind the real calibration count, never hard-code six."}, {"id": "05-ready", "title": "Return-serve / coaching", "html": "<div class=\"frame court\"><div class=\"scorebug\"><div class=\"scorehead\">TROPICAL OPEN \u00b7 SET 1</div><div class=\"scoreline\"><i class=\"dot\"></i><span>ADNAN</span><span class=\"games\">2</span><span class=\"pointnum\">0</span></div><div class=\"scoreline rival\"><i></i><span>RILEY</span><span class=\"games\">1</span><span class=\"pointnum\">0</span></div></div><button class=\"pause\" aria-label=\"Pause match\">\u2161</button><div style=\"position:absolute;bottom:52px;left:410px\" class=\"panel\"><span class=\"caps\">RILEY IS SERVING</span><p style=\"margin-top:10px\">Get ready to return.</p></div></div>", "note": "One prompt at a time, placed below play. Hide after the serve begins; a first-time coaching hint may replace this line."}, {"id": "06-serve", "title": "Serve timing", "html": "<div class=\"frame court\"><div class=\"scorebug\"><div class=\"scorehead\">TROPICAL OPEN \u00b7 SET 1</div><div class=\"scoreline\"><i class=\"dot\"></i><span>ADNAN</span><span class=\"games\">2</span><span class=\"pointnum\">0</span></div><div class=\"scoreline rival\"><i></i><span>RILEY</span><span class=\"games\">1</span><span class=\"pointnum\">0</span></div></div><button class=\"pause\" aria-label=\"Pause match\">\u2161</button><div class=\"panel\" style=\"position:absolute;left:64px;bottom:55px;width:430px\"><div class=\"topline\"><h3>Your serve</h3><span class=\"chip orange\">1st</span></div><p class=\"small muted\" style=\"margin:14px 0 22px\">Swing as the marker meets orange.</p><div class=\"meter\"><i class=\"target\"></i><i class=\"needle\"></i></div><div class=\"footerline\" style=\"margin-top:13px\"><span>EARLY</span><span>LATE</span></div></div></div>", "note": "Timing remains skillful. This panel replaces the current colored serve bar at integration; that existing world-space bar remains visible in the unmodified backdrop."}, {"id": "07-rally", "title": "Scorebug / active play", "html": "<div class=\"frame court\"><div class=\"scorebug\"><div class=\"scorehead\">TROPICAL OPEN \u00b7 SET 1</div><div class=\"scoreline\"><i class=\"dot\"></i><span>ADNAN</span><span class=\"games\">2</span><span class=\"pointnum\">30</span></div><div class=\"scoreline rival\"><i></i><span>RILEY</span><span class=\"games\">1</span><span class=\"pointnum\">15</span></div></div><button class=\"pause\" aria-label=\"Pause match\">\u2161</button><div style=\"position:absolute;bottom:48px;left:64px\" class=\"chip\">\u2194  8-SHOT RALLY</div></div>", "note": "Most of the court stays clear. Scorebug shows names, games, points, and a serving dot. Rally badge is brief after a milestone, not constantly animated."}, {"id": "08-feedback", "title": "Shot quality system", "html": "<div class=\"frame\"><div class=\"safe\"><div class=\"topline\"><span class=\"club\">ISLAND / SPORTS CLUB</span><span class=\"chip\">COMPONENT STUDY / SHOT FEEDBACK</span></div><h2 style=\"margin:42px 0 16px\">One hit. One clear read.</h2><p class=\"muted\">Timing is the headline. Ball speed is the proof.</p><div class=\"grid\" style=\"grid-template-columns:repeat(3,1fr);margin-top:42px\"><div class=\"panel\"><div class=\"feedback\" style=\"background:#3ddc97;width:100%\"><h3 style=\"font-size:30px\">PERFECT!</h3><p>118 km/h \u00b7 Clean timing</p></div><p class=\"note\" style=\"margin-top:20px\">Small star tick; 700 ms hold.</p></div><div class=\"panel\"><div class=\"feedback\" style=\"background:#b9efd9;width:100%\"><h3 style=\"font-size:30px\">EXCELLENT</h3><p>105 km/h \u00b7 Sweet contact</p></div><p class=\"note\" style=\"margin-top:20px\">Same footprint; lower emphasis.</p></div><div class=\"panel\"><div class=\"feedback\" style=\"background:#b7d0ff;width:100%\"><h3 style=\"font-size:30px\">GREAT</h3><p>91 km/h \u00b7 Nice swing</p></div><p class=\"note\" style=\"margin-top:20px\">No extra center-screen banner.</p></div><div class=\"panel\"><div class=\"feedback\" style=\"background:#d8e5fb;width:100%\"><h3 style=\"font-size:30px\">GOOD</h3><p>76 km/h \u00b7 In play</p></div><p class=\"note\" style=\"margin-top:20px\">Quiet confirmation.</p></div><div class=\"panel\"><div class=\"feedback\" style=\"background:#f4f0e6;width:100%\"><h3 style=\"font-size:30px\">OK</h3><p>54 km/h \u00b7 A little early</p></div><p class=\"note\" style=\"margin-top:20px\">Actionable timing, no scolding.</p></div><div class=\"panel\"><div class=\"feedback\" style=\"background:#ffb5c5;width:100%\"><h3 style=\"font-size:30px\">WHIFF!</h3><p>A little late. Try the next one.</p></div><p class=\"note\" style=\"margin-top:20px\">Friendly, brief, readable.</p></div></div></div></div>", "note": "Grades use both labels and color. Speeds are illustrative; render actual shot speed. No ultimate or SUPER power badge."}, {"id": "09-calls", "title": "Umpire / match calls", "html": "<div class=\"frame\"><div class=\"safe\"><div class=\"topline\"><span class=\"club\">ISLAND / SPORTS CLUB</span><span class=\"chip\">COMPONENT STUDY / MATCH CALLS</span></div><h2 style=\"margin:40px 0 30px\">Big moments, short words.</h2><div class=\"grid\" style=\"grid-template-columns:repeat(4,1fr)\"><div class=\"panel\" style=\"padding:20px;border-top:5px solid #3ddc97\"><h3 style=\"font-size:25px\">ACE</h3><p class=\"small muted\" style=\"margin-top:10px\">Untouched serve</p></div><div class=\"panel\" style=\"padding:20px;border-top:5px solid #3ddc97\"><h3 style=\"font-size:25px\">WINNER</h3><p class=\"small muted\" style=\"margin-top:10px\">Clean finish</p></div><div class=\"panel\" style=\"padding:20px;border-top:5px solid #ff5a7a\"><h3 style=\"font-size:25px\">OUT</h3><p class=\"small muted\" style=\"margin-top:10px\">Beyond the line</p></div><div class=\"panel\" style=\"padding:20px;border-top:5px solid #ff5a7a\"><h3 style=\"font-size:25px\">NET</h3><p class=\"small muted\" style=\"margin-top:10px\">Caught the tape</p></div><div class=\"panel\" style=\"padding:20px;border-top:5px solid #ff5a7a\"><h3 style=\"font-size:25px\">FAULT</h3><p class=\"small muted\" style=\"margin-top:10px\">Second serve</p></div><div class=\"panel\" style=\"padding:20px;border-top:5px solid #ff5a7a\"><h3 style=\"font-size:25px\">DOUBLE FAULT</h3><p class=\"small muted\" style=\"margin-top:10px\">Point to Riley</p></div><div class=\"panel\" style=\"padding:20px;border-top:5px solid #5b8cff\"><h3 style=\"font-size:25px\">DEUCE</h3><p class=\"small muted\" style=\"margin-top:10px\">Win by two</p></div><div class=\"panel\" style=\"padding:20px;border-top:5px solid #5b8cff\"><h3 style=\"font-size:25px\">ADVANTAGE</h3><p class=\"small muted\" style=\"margin-top:10px\">Adnan</p></div><div class=\"panel\" style=\"padding:20px;border-top:5px solid #ff6b3d\"><h3 style=\"font-size:25px\">GAME</h3><p class=\"small muted\" style=\"margin-top:10px\">Adnan leads 3\u20131</p></div><div class=\"panel\" style=\"padding:20px;border-top:5px solid #ff6b3d\"><h3 style=\"font-size:25px\">MATCH POINT</h3><p class=\"small muted\" style=\"margin-top:10px\">One more point</p></div><div class=\"panel\" style=\"padding:20px;border-top:5px solid #5b8cff\"><h3 style=\"font-size:25px\">SECOND SERVE</h3><p class=\"small muted\" style=\"margin-top:10px\">Reset. You\u2019ve got this.</p></div><div class=\"panel\" style=\"padding:20px;border-top:5px solid #3ddc97\"><h3 style=\"font-size:25px\">PLAY</h3><p class=\"small muted\" style=\"margin-top:10px\">Let\u2019s rally</p></div></div></div></div>", "note": "Replace current mixed word-art with one ticket family. Queue one call; point results take precedence over shot badges. No camera cut."}, {"id": "10-point", "title": "Point / score change", "html": "<div class=\"frame court\"><div class=\"scorebug\"><div class=\"scorehead\">TROPICAL OPEN \u00b7 SET 1</div><div class=\"scoreline\"><i class=\"dot\"></i><span>ADNAN</span><span class=\"games\">2</span><span class=\"pointnum\">40</span></div><div class=\"scoreline rival\"><i></i><span>RILEY</span><span class=\"games\">1</span><span class=\"pointnum\">15</span></div></div><button class=\"pause\" aria-label=\"Pause match\">\u2161</button><div style=\"position:absolute;left:470px;top:55px\" class=\"call\"><div class=\"eyebrow\" style=\"margin-bottom:8px\">WINNER</div><h2>Point, Adnan.</h2><div class=\"bold\" style=\"font-size:34px;margin-top:10px\">40 \u2014 15</div></div></div>", "note": "Keep the third-person camera. Short score-change card at the upper edge; it clears before the next serve."}, {"id": "11-set", "title": "Set complete", "html": "<div class=\"frame court\"><div class=\"scorebug\"><div class=\"scorehead\">TROPICAL OPEN \u00b7 SET 1</div><div class=\"scoreline\"><i class=\"dot\"></i><span>ADNAN</span><span class=\"games\">2</span><span class=\"pointnum\">0</span></div><div class=\"scoreline rival\"><i></i><span>RILEY</span><span class=\"games\">1</span><span class=\"pointnum\">0</span></div></div><button class=\"pause\" aria-label=\"Pause match\">\u2161</button><div class=\"shade\"></div><div class=\"panel centerpanel\"><span class=\"caps\">SET COMPLETE</span><h1 style=\"font-size:64px;margin-top:18px\">Nice work.</h1><div class=\"bigscore\">6 \u2014 4</div><p class=\"muted\">Adnan takes the first set.</p><div class=\"rule\"></div><button class=\"button\">Continue to set 2 \u2192</button><p class=\"small muted\" style=\"margin-top:20px\">Tap Continue on your phone.</p></div></div>", "note": "Phone must expose the same Continue action only after set completion. Also offer Exit on the phone; never ask for a swing here."}, {"id": "12-pause", "title": "Pause / exit confirmation", "html": "<div class=\"frame court\"><div class=\"scorebug\"><div class=\"scorehead\">TROPICAL OPEN \u00b7 SET 1</div><div class=\"scoreline\"><i class=\"dot\"></i><span>ADNAN</span><span class=\"games\">2</span><span class=\"pointnum\">30</span></div><div class=\"scoreline rival\"><i></i><span>RILEY</span><span class=\"games\">1</span><span class=\"pointnum\">15</span></div></div><button class=\"pause\" aria-label=\"Pause match\">\u2161</button><div class=\"shade\"></div><div class=\"panel centerpanel\"><span class=\"caps\">TAKE A BREATHER</span><h1 style=\"font-size:64px;margin:16px 0 28px\">Paused.</h1><div class=\"stack\"><button class=\"button\">Back to the court \u2192</button><button class=\"button secondary\">Sound & controls</button><button class=\"button secondary\">Exit to menu</button></div><p class=\"small muted\" style=\"margin-top:22px\">Exit asks for confirmation during a match.</p></div></div>", "note": "Pause stops input and match time. Destructive confirmation reuses this modal; primary becomes Keep playing, secondary Exit match."}, {"id": "13-reconnect", "title": "Connection recovery", "html": "<div class=\"frame\"><div class=\"scorebug\"><div class=\"scorehead\">TROPICAL OPEN \u00b7 SET 1</div><div class=\"scoreline\"><i class=\"dot\"></i><span>ADNAN</span><span class=\"games\">2</span><span class=\"pointnum\">30</span></div><div class=\"scoreline rival\"><i></i><span>RILEY</span><span class=\"games\">1</span><span class=\"pointnum\">15</span></div></div><button class=\"pause\" aria-label=\"Pause match\">\u2161</button><div class=\"shade\"></div><div class=\"panel centerpanel\"><span class=\"chip pink\">PHONE DISCONNECTED</span><h2 style=\"margin:25px 0 20px\">We\u2019ll hold<br>your place.</h2><p class=\"muted\">Reconnect your phone to resume.<br>Your match is paused.</p><div class=\"rule\"></div><div class=\"row\"><span class=\"ball\" style=\"width:26px;height:26px\"></span><p class=\"small\">Waiting for controller\u2026</p></div><div style=\"margin-top:24px\"><button class=\"button secondary\">Exit to menu</button></div></div></div>", "note": "Differentiate controller disconnected, display disconnected, and loading failure. Display loss returns controls to the phone; no fake online reconnect."}, {"id": "14-win", "title": "Match complete / campaign win", "html": "<div class=\"frame\"><div class=\"safe\"><div class=\"topline\"><span class=\"club\">ISLAND / SPORTS CLUB</span><span class=\"chip\">MATCH COMPLETE</span></div><div class=\"courtmark\"></div><div style=\"margin-top:62px;width:670px\"><span class=\"chip mint\">VICTORY</span><h1 style=\"margin-top:24px\">That\u2019s a win.</h1><div class=\"bigscore\">6 \u2014 4</div><p class=\"muted\">Adnan defeats Riley \u00b7 Tropical Open</p><div class=\"row\" style=\"margin-top:30px\"><div class=\"stat\"><strong>12</strong><span>Perfect strikes</span></div><div class=\"stat\"><strong>18</strong><span>Longest rally</span></div></div></div><div style=\"position:absolute;right:75px;top:210px\"><div class=\"artmark\"><div class=\"ball\"></div></div></div><div class=\"bottom row\"><button class=\"button\">Next round \u2192</button><button class=\"button secondary\">Replay</button><button class=\"button secondary\">Exit to menu</button><span class=\"note\" style=\"margin-left:auto\">View rewards \u2197</span></div></div></div>", "note": "Persistent actions, never auto-dismiss. Next round appears only when eligible; casual win uses Replay as primary. Live equipped hero replaces the racket vignette in production."}, {"id": "15-loss", "title": "Match complete / loss", "html": "<div class=\"frame\"><div class=\"safe\"><div class=\"topline\"><span class=\"club\">ISLAND / SPORTS CLUB</span><span class=\"chip\">MATCH COMPLETE</span></div><div style=\"margin-top:70px\"><span class=\"chip blue\">RILEY TAKES THIS ONE</span><h1 style=\"margin-top:26px\">Run it back?</h1><div class=\"bigscore\">4 \u2014 6</div><p class=\"muted\">Good rallies. Another chance to find your rhythm.</p><div class=\"row\" style=\"margin-top:35px\"><div class=\"stat\"><strong>9</strong><span>Perfect strikes</span></div><div class=\"stat\"><strong>14</strong><span>Longest rally</span></div></div></div><div class=\"bottom row\"><button class=\"button\">Replay \u2192</button><button class=\"button secondary\">Exit to menu</button><span class=\"note\" style=\"margin-left:24px\">View rewards \u2197</span></div></div></div>", "note": "No fake Next unlock after a loss. Same layout and dignity as victory; friendly language without mocking the player."}, {"id": "16-rewards", "title": "Optional rewards / identity", "html": "<div class=\"frame\"><div class=\"safe\"><div class=\"topline\"><span class=\"club\">ISLAND / SPORTS CLUB</span><span class=\"chip\">YOUR MATCH REP</span></div><div style=\"margin-top:58px\"><span class=\"chip\">COSMETIC PROGRESSION</span><h1 style=\"margin-top:24px\">A little more you.</h1></div><div class=\"row\" style=\"margin-top:36px\"><div class=\"panel\" style=\"width:615px\"><div class=\"topline\"><h2>+180 XP</h2><span class=\"chip blue\">LEVEL 08</span></div><div class=\"progress\" style=\"margin-top:25px\"><i style=\"width:70%\"></i></div><p class=\"small muted\" style=\"margin-top:12px\">420 / 600 XP</p></div><div class=\"panel\" style=\"flex:1\"><span class=\"caps\">STYLE UNLOCK</span><h3 style=\"margin:15px 0\">Sunset visor</h3><p class=\"small muted\">A fresh look. Same abilities.</p></div></div><div class=\"bottom row\"><button class=\"button\">Back to results \u2192</button><button class=\"button secondary\">View in locker</button></div></div></div>", "note": "Use only real reward data. This optional screen never blocks Replay, Continue, or Exit; unlock art is a separate cosmetic thumbnail slot."}, {"id": "17-phone-play", "title": "Phone / active controller", "html": "<div class=\"frame\"><div class=\"safe\"><div style=\"position:absolute;top:85px;width:560px\"><div class=\"eyebrow\">PHONE COMPANION / PLAYING</div><h1>Eyes on<br>the court.</h1><p class=\"muted\" style=\"margin-top:28px\">Your phone is the racket.<br>One special action: Dive.</p><div class=\"rule\"></div><p class=\"note\">Native safe areas \u00b7 56pt+ controls<br>Pause stays reachable. No ultimate meter.</p></div></div><div class=\"phone full\"><div class=\"island\"></div><div class=\"phonebody\"><div class=\"topline\"><span class=\"chip\">\u25cf TV connected</span><button class=\"chip\" aria-label=\"Pause match\" style=\"border:0\">\u2161</button></div><div style=\"text-align:center;margin-top:28px\"><span class=\"caps\">ADNAN / TENNIS</span><h2 style=\"margin-top:13px\">You\u2019re in play.</h2><p class=\"muted\" style=\"margin-top:9px\">Swing to return the ball.</p></div><div style=\"position:absolute;left:100px;top:230px\"><div class=\"racket\"></div></div><div class=\"bottom stack\"><button class=\"button\">\u2198  DIVE</button><p style=\"text-align:center;color:var(--muted);font-size:14px\">Keep a comfortable grip.</p></div></div></div></div>", "note": "The controller\u2019s playing state. Dive readiness/cooldown changes the same button; it never becomes an ultimate."}, {"id": "18-phone-finished", "title": "Phone / post-game actions", "html": "<div class=\"frame\"><div class=\"safe\"><div style=\"position:absolute;top:85px;width:560px\"><div class=\"eyebrow\">PHONE COMPANION / MATCH COMPLETE</div><h1>The racket<br>takes a break.</h1><p class=\"muted\" style=\"margin-top:28px\">Real buttons replace swing controls<br>as soon as the match ends.</p><div class=\"rule\"></div><p class=\"note\">Persistent result state \u00b7 tap to advance<br>TV and phone read the same result payload.</p></div></div><div class=\"phone full\"><div class=\"island\"></div><div class=\"phonebody\"><div class=\"topline\"><span class=\"chip\">\u25cf TV connected</span><span class=\"caps\">FINAL</span></div><div style=\"margin-top:50px\"><span class=\"chip mint\">VICTORY</span><h1 style=\"margin-top:22px\">That\u2019s a win.</h1><div class=\"bigscore\" style=\"font-size:72px;margin:20px 0\">6 \u2014 4</div><p class=\"muted\">You beat Riley.</p></div><div class=\"bottom stack\"><button class=\"button\">Next round \u2192</button><button class=\"button secondary\">Replay</button><button class=\"button secondary\">Exit to menu</button><button style=\"background:none;border:0;padding:8px;color:var(--muted);font-size:16px\">View rewards</button></div></div></div></div>", "note": "Campaign example. Hide Next when ineligible. Button taps acknowledge/loading/disable repeat taps; failure restores actions with an inline message."}, {"id": "19-loading-error", "title": "Loading delay / retry", "html": "<div class=\"frame\"><div class=\"safe\"><div class=\"topline\"><span class=\"club\">ISLAND / SPORTS CLUB</span><span class=\"chip\">TENNIS</span></div><div style=\"margin-top:104px;width:850px\"><span class=\"chip pink\">TAKING LONGER THAN EXPECTED</span><h1 style=\"margin-top:28px;font-size:70px\">The court needs<br>another minute.</h1><p class=\"muted\" style=\"margin-top:25px\">We couldn\u2019t finish setting up this match.<br>Try again, or head back to the menu.</p><div class=\"row\" style=\"margin-top:38px\"><button class=\"button\">Try again \u2192</button><button class=\"button secondary\">Back to menu</button></div></div><div class=\"bottom footerline\"><span>Your campaign progress is saved.</span><span>No match started</span></div></div></div>", "note": "8 seconds: still loading status. At existing 20-second stalled threshold: retry/menu. Never fake a completed progress bar or strand the controller."}, {"id": "20-components", "title": "Shared components / other sports", "html": "<div class=\"frame\"><div class=\"safe\"><div class=\"topline\"><span class=\"club\">ISLAND / SPORTS CLUB</span><span class=\"chip\">DESIGN SYSTEM / REUSABLE KIT</span></div><h2 style=\"margin:35px 0 25px\">Same club. Every sport.</h2><div class=\"grid\" style=\"grid-template-columns:1.2fr 1fr\"><div class=\"panel stack\"><span class=\"caps\">BUTTONS + STATES</span><div class=\"row\"><button class=\"button\">Continue \u2192</button><button class=\"button secondary\">Replay</button></div><div class=\"row\"><button class=\"button\" disabled>Loading\u2026</button><span class=\"chip mint\">\u2713 Connected</span></div><p class=\"note\">Orange action \u00b7 navy text \u00b7 3px press travel</p></div><div class=\"panel stack\"><span class=\"caps\">GOLF / ADAPTER EXAMPLE</span><h3>Hole 03 <span class=\"muted\">/ PAR 4</span></h3><div class=\"row\"><span class=\"chip orange\">ADNAN</span><span class=\"bold\" style=\"font-size:32px\">2 strokes</span></div><p class=\"small muted\">148 yd to pin \u00b7 3 mph \u2197</p></div></div><div class=\"grid\" style=\"grid-template-columns:repeat(6,1fr);margin-top:25px\"><div class=\"swatch\" style=\"background:#203047;color:white\">INK<div style=\"font-size:13px;margin-top:8px\">#203047</div></div><div class=\"swatch\" style=\"background:#F4F0E6;color:#203047\">PAPER<div style=\"font-size:13px;margin-top:8px\">#F4F0E6</div></div><div class=\"swatch\" style=\"background:#FF6B3D;color:#203047\">ACTION<div style=\"font-size:13px;margin-top:8px\">#FF6B3D</div></div><div class=\"swatch\" style=\"background:#5B8CFF;color:#203047\">PLAYER 2<div style=\"font-size:13px;margin-top:8px\">#5B8CFF</div></div><div class=\"swatch\" style=\"background:#3DDC97;color:#203047\">CLEAN HIT<div style=\"font-size:13px;margin-top:8px\">#3DDC97</div></div><div class=\"swatch\" style=\"background:#FF5A7A;color:#203047\">WHIFF<div style=\"font-size:13px;margin-top:8px\">#FF5A7A</div></div></div><p class=\"note\" style=\"margin-top:24px\">Rubik Bold + Roboto \u00b7 no baked text in production \u00b7 no color-only meaning</p></div></div>", "note": "Golf uses the same components with sport-specific metrics. No gameplay changes or unsupported features implied by this design study."}, {"id": "21-shot-in-play", "title": "Shot feedback / in context", "html": "<div class=\"frame court\"><div class=\"scorebug\"><div class=\"scorehead\">TROPICAL OPEN \u00b7 SET 1</div><div class=\"scoreline\"><i class=\"dot\"></i><span>ADNAN</span><span class=\"games\">2</span><span class=\"pointnum\">30</span></div><div class=\"scoreline rival\"><i></i><span>RILEY</span><span class=\"games\">1</span><span class=\"pointnum\">15</span></div></div><button class=\"pause\" aria-label=\"Pause match\">\u2161</button><div class=\"feedback\" style=\"position:absolute;left:64px;bottom:60px\"><h3>\u2726 PERFECT!</h3><p>118 km/h \u00b7 Clean timing</p></div></div>", "note": "The same feedback component in context: one brief badge, clear of the near player. No camera change."}, {"id": "22-screen-check", "title": "Display / screen check", "html": "<div class=\"frame\"><div class=\"safe\"><div class=\"topline\"><span class=\"club\">ISLAND / SPORTS CLUB</span><span class=\"chip\">BEFORE WE PLAY</span></div><div style=\"margin-top:70px;max-width:670px\"><div class=\"eyebrow\">LOOK UP AT YOUR SCREEN</div><h1>See this<br>on your TV?</h1><p class=\"muted\" style=\"margin-top:25px\">Confirm on your phone when this court<br>is visible on the big screen.</p><div class=\"row\" style=\"margin-top:35px\"><button class=\"button\">Yes, I can see it \u2192</button><button class=\"button secondary\">Help connecting</button></div></div><div class=\"panel\" style=\"position:absolute;right:0;top:160px;width:360px;height:240px;background:var(--sky);border:12px solid var(--ink);display:flex;align-items:center;justify-content:center\"><div class=\"ball\"></div></div><div class=\"bottom footerline\"><span>TV or Mac \u00b7 same Wi-Fi \u00b7 Screen Mirroring</span><span>Screen check</span></div></div></div>", "note": "Manual confirmation fallback avoids making camera recognition of a MacBook a hard gate. Real device connection state still determines the next step."}, {"id": "23-tutorial", "title": "Tutorial / first swing", "html": "<div class=\"frame court\"><div class=\"scorebug\"><div class=\"scorehead\">TROPICAL OPEN \u00b7 SET 1</div><div class=\"scoreline\"><i class=\"dot\"></i><span>ADNAN</span><span class=\"games\">2</span><span class=\"pointnum\">0</span></div><div class=\"scoreline rival\"><i></i><span>RILEY</span><span class=\"games\">1</span><span class=\"pointnum\">0</span></div></div><button class=\"pause\" aria-label=\"Pause match\">\u2161</button><div class=\"panel\" style=\"position:absolute;left:64px;bottom:48px;width:510px;border-left:9px solid var(--orange)\"><div class=\"topline\"><span class=\"caps\">STEP 2 / 4</span><span class=\"chip\">SWING</span></div><h3 style=\"margin-top:18px\">Send it back.</h3><p class=\"small muted\" style=\"margin-top:12px\">Swing as the ball comes beside you.<br>Clean timing means more speed.</p><div class=\"row\" style=\"margin-top:20px\"><button class=\"button secondary\">Show me</button><span class=\"small muted\">Waiting for your return\u2026</span></div></div></div>", "note": "Instruction and actual completion state are separate. Advance when the action succeeds; no unreachable movement goals. Steps/count come from the playable tutorial."}, {"id": "24-settings", "title": "In-match sound / controls", "html": "<div class=\"frame court\"><div class=\"scorebug\"><div class=\"scorehead\">TROPICAL OPEN \u00b7 SET 1</div><div class=\"scoreline\"><i class=\"dot\"></i><span>ADNAN</span><span class=\"games\">2</span><span class=\"pointnum\">30</span></div><div class=\"scoreline rival\"><i></i><span>RILEY</span><span class=\"games\">1</span><span class=\"pointnum\">15</span></div></div><button class=\"pause\" aria-label=\"Pause match\">\u2161</button><div class=\"shade\"></div><div class=\"panel centerpanel\" style=\"width:650px\"><span class=\"caps\">MATCH PAUSED</span><h2 style=\"margin:20px 0 28px\">Make it yours.</h2><div class=\"stack\"><div class=\"topline\"><h3>Music</h3><span class=\"chip\">60%</span></div><div class=\"progress\"><i style=\"width:60%\"></i></div><div class=\"topline\"><h3>Game sounds</h3><span class=\"chip\">80%</span></div><div class=\"progress\"><i style=\"width:80%\"></i></div><div class=\"topline\"><h3>Haptics</h3><span class=\"chip mint\">\u2713 On</span></div><div class=\"rule\"></div><button class=\"button\">Done \u2192</button></div></div></div>", "note": "Example control styling; bind only supported settings. Native sliders/toggles receive labels, values, focus and larger-text layouts."}, {"id": "25-exit-confirm", "title": "Exit confirmation", "html": "<div class=\"frame court\"><div class=\"scorebug\"><div class=\"scorehead\">TROPICAL OPEN \u00b7 SET 1</div><div class=\"scoreline\"><i class=\"dot\"></i><span>ADNAN</span><span class=\"games\">2</span><span class=\"pointnum\">30</span></div><div class=\"scoreline rival\"><i></i><span>RILEY</span><span class=\"games\">1</span><span class=\"pointnum\">15</span></div></div><button class=\"pause\" aria-label=\"Pause match\">\u2161</button><div class=\"shade\"></div><div class=\"panel centerpanel\"><span class=\"caps\">LEAVING ALREADY?</span><h2 style=\"margin:20px 0\">Exit this match?</h2><p class=\"muted\">This match won\u2019t count as a win.<br>Your previous progress is safe.</p><div class=\"stack\" style=\"margin-top:32px\"><button class=\"button\">Keep playing \u2192</button><button class=\"button secondary\">Exit match</button></div></div></div>", "note": "Only when abandoning an active match. Completed-match Exit returns immediately; it must not trap the player behind another confirmation."}];const q=new URLSearchParams(location.search);function show(i){i=Math.max(0,Math.min(screens.length-1,i));const s=screens[i];document.querySelector('.stage').innerHTML=s.html;document.querySelector('.caption').innerHTML='<strong>'+s.id+' / '+s.title+'</strong><span>'+s.note+'</span>';document.querySelectorAll('nav button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j));if(!q.has('capture'))history.replaceState(null,'','#'+s.id);document.querySelectorAll('.frame button').forEach(b=>b.onclick=()=>{b.dataset.original??=b.textContent;b.textContent='Preview only';setTimeout(()=>b.textContent=b.dataset.original,700)});}screens.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.id.slice(0,2)+' '+s.title;b.onclick=()=>show(i);document.querySelector('nav').append(b)});if(q.has('capture')){document.body.className='only';document.querySelector('header').remove();document.querySelector('nav').remove();document.querySelector('.caption').style.display='none';document.querySelector('.stage').style.margin='0';}function fit(){if(!q.has('capture')){document.querySelector('.stage').style.zoom=Math.min(1,(innerWidth-40)/1280);document.querySelector('.caption').style.maxWidth=Math.min(1280,innerWidth-40)+'px';}}addEventListener('resize',fit);fit();show(q.has('capture')?Number(q.get('capture')):Math.max(0,screens.findIndex(s=>s.id===location.hash.slice(1))));</script></body></html>
