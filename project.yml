name: GolfArcade
options:
  bundleIdPrefix: com.aloniewski
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9VP5B3Q5VQ
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  GolfArcade:
    type: application
    platform: iOS
    info:
      path: GolfArcade/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: Golf TV
                UISceneClassName: UIWindowScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).GolfExternalSceneDelegate
    sources:
      - path: GolfArcade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aloniewski.GolfArcade
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Your camera tracks your body movement to turn your swing into a golf shot.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  GolfArcadeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GolfArcadeTests
    dependencies:
      - target: GolfArcade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aloniewski.GolfArcadeTests
        GENERATE_INFOPLIST_FILE: YES
  GolfArcadeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GolfArcadeUITests
    dependencies:
      - target: GolfArcade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aloniewski.GolfArcadeUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GolfArcade:
    build:
      targets:
        GolfArcade: all
        GolfArcadeTests: [test]
        GolfArcadeUITests: [test]
    test:
      targets:
        - GolfArcadeTests
        - GolfArcadeUITests
