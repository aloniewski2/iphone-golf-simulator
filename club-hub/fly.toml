# Fly.io: one small always-on machine for the Club Hub (presence, invites, party rooms). State is in memory, so exactly one
# machine (see README "Deploy"). First time:  fly launch --copy-config --no-deploy  then  fly deploy
app = "motion-club-hub"
primary_region = "iad"

[build]

[env]
  PORT = "8090"
  HUB_BUNDLE_IDS = "com.adnanandrew.motionsports"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "off"     # an idle socket must never be dropped by a sleeping machine
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 5000
    hard_limit = 8000

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
